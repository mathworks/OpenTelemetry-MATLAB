# Install a released OpenTelemetry-Matlab toolbox on Linux and run the GitHub example, with
# the workflow itself instrumented to emit OpenTelemetry spans. The MATLAB example picks up
# the TRACEPARENT environment variable set by the instrumentation so that the MATLAB spans
# and the GitHub workflow spans form a single trace.
name: "GitHub Workflow Tracing Test"
on:
    workflow_dispatch:
    push:
      branches:
        - github_otel
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
jobs:
    run-github-example-ubuntu:
        runs-on: ubuntu-22.04
        env:
            OTEL_MATLAB_RELEASE: "1.11.0"
            OTEL_MATLAB_MLTBX: "${{ github.workspace }}/otel-matlab.mltbx"
        steps:
            # must be the first step so that all subsequent steps are captured as spans
            - name: Instrument job
              uses: plengauer/Thoth/actions/instrument/job@v5
              env:
                OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
                OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
                OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
              with:
                cache: 'false'
            # source is only needed for the example
            - name: Download OpenTelemetry-Matlab source
              uses: actions/checkout@v3
              with:
                path: opentelemetry-matlab
            - name: Download OpenTelemetry-Matlab release
              env:
                GH_TOKEN: ${{ github.token }}
              run: gh release download "${{ env.OTEL_MATLAB_RELEASE }}" --repo "${{ github.repository }}" --pattern otel-matlab.mltbx --output "${{ env.OTEL_MATLAB_MLTBX }}"
            - name: Install MATLAB
              uses: matlab-actions/setup-matlab@v2
              with:
                release: R2025a
            # Run MATLAB in a shell step (rather than via matlab-actions/run-command) so that
            # it inherits the TRACEPARENT environment variable injected by the instrumentation.
            # The OTLP HTTP exporter in MATLAB reads the endpoint and headers from the
            # OTEL_EXPORTER_OTLP_* environment variables.
            - name: Run GitHub example
              env:
                 # Add the example directory to the MATLAB Search Path by
                 # setting the MATLABPATH environment variable.
                 MATLABPATH: "${{ github.workspace }}/opentelemetry-matlab/examples/github"
                 OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
                 OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
                 OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
              run: |
                  echo "TRACEPARENT=$TRACEPARENT"
                  # install the toolbox, run the example, then shut down the tracer provider
                  # to flush all spans before MATLAB exits
                  matlab-batch "matlab.addons.install('${{ env.OTEL_MATLAB_MLTBX }}', true); github_example; opentelemetry.sdk.common.Cleanup.shutdown(opentelemetry.trace.Provider.getTracerProvider());"
